services:
  orbitx:
    image: ${DOCKER_REGISTRY-}orbitx-local
    build:
      context: .
      dockerfile: OrbitX/Dockerfile
    container_name: orbitx-local
    restart: always
    networks:
      - orbitx-network-local
    env_file:
      - .env
    environment:
      - ConnectionStrings__DefaultConnection=${DB_CONNECTION_STRING}
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT}
    depends_on:
      - db

  db:
    image: postgres:15-alpine
    container_name: orbitx-db-local
    restart: always
    networks:
      - orbitx-network-local
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data_local:/var/lib/postgresql/data

  orbitx.frontend:
    image: ${DOCKER_REGISTRY-}orbitx-frontend-local
    build:
      context: .
      dockerfile: orbitx.frontend/Dockerfile
    container_name: orbitx.frontend-local
    restart: always
    networks:
      - orbitx-network-local

  proxy:
    image: nginx:stable-alpine
    container_name: orbitx-gateway-local
    restart: always
    ports:
      - "${PROXY_HTTP_PORT}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - orbitx-network-local
    depends_on:
      - orbitx
      - orbitx.frontend

volumes:
  postgres_data_local:

networks:
  orbitx-network-local:
    driver: bridge